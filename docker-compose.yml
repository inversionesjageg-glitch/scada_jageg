services:
  db:
    image: postgis/postgis:15-3.3
    container_name: scada_postgres
    env_file:
      - ./BackEnd/.env
    command: ["postgres", "-c", "listen_addresses=*"]
    ports:
      - "5433:5432"
    volumes:
      - scada_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
      network: host
    container_name: scada_api
    network_mode: "host"
    environment:
      - PYTHONPATH=/app
      - PYTHONNOUSERSITE=1
    env_file:
      - ./BackEnd/.env
    depends_on:
      - db
    volumes:
      - ./BackEnd:/app                      # 1. Mapea la carpeta completa para que main.py y app estén en su lugar
      - /app/static                         # 2. Volumen anónimo para proteger los estáticos de subidas físicas
      - /app/__pycache__                    # 3. Evita que las cachés del host y del contenedor choquen
    #command: ["/usr/local/bin/python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      network: host
    container_name: scada_web
    network_mode: "host"  # Se une directo a la interfaz de la VM
    command: npm run dev -- --port 3001 --host 0.0.0.0
    # Quitamos el 'command' de aquí para que use el CMD exacto y optimizado de tu Dockerfile
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules
    #  - scada_node_modules:/app/node_modules # 💡 Usamos un volumen nombrado para garantizar persistencia y aislamiento completo
    environment:
      - WATCHPACK_POLLING=true # Obliga al motor de empaquetado a refrescar cambios dentro de la VM
    depends_on:
      - backend

volumes:
  scada_data: